name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Build public local APK (no login, no cloud, no API keys)
        run: flutter build apk --release --dart-define=APP_AUTH_MODE=local
      - name: Rename artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/subctrl-local-release.apk
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/subctrl-local-release.apk
          generate_release_notes: true
