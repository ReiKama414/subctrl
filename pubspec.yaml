name: subctrl
description: SUB//CTRL — Subscription Control Center
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.4.2
  local_auth: ^2.3.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  http: ^1.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  fl_chart: ^1.1.1
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  collection: ^1.19.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  flutter_line_sdk: ^3.0.0
  cloud_firestore: ^6.10.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.7.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/backgrounds/
    - assets/illustrations/
    - assets/logos/
